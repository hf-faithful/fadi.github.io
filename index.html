<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HF+ Free Trial – Funnel Prototype (brief-aligned)</title>
<style>
:root{--bg:#faf9f5;--panel:#f0e9df;--mint:#b4e5b9;--aqua:#c6f2e4;--lime:#e1f6b5;--green:#067a46;--deep:#00551f;--ink:#242424;--muted:#6b6b6b;--red:#b50000;--line:#d9d2c5;--ph:#fff2a8;--pink:#d6247f}
*{box-sizing:border-box}
body{margin:0;background:#e6e3db;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);font-size:16px}
button{font-family:inherit}
s{color:#555}
/* toolbar */
.tb{position:sticky;top:0;z-index:30;background:#1f2a24;color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12px}
.tb .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tb .grp>span{opacity:.6;margin-right:4px;text-transform:uppercase;font-size:10px;letter-spacing:.06em}
.tb button{font-size:12px;background:transparent;color:#fff;border:1px solid #ffffff55;padding:5px 10px;border-radius:6px;cursor:pointer}
.tb button.on{background:#fff;color:#1f2a24;border-color:#fff;font-weight:700}
.tb label{display:flex;gap:6px;align-items:center;cursor:pointer}
.wrap{max-width:1280px;margin:16px auto 36px;padding:0 16px}
.frame{background:var(--bg);border-radius:12px;box-shadow:0 2px 20px #0002;padding:0 40px 48px;min-height:640px;overflow:hidden}
/* header */
.hd{display:grid;grid-template-columns:120px 1fr 72px;align-items:start;padding:16px 0 8px}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px;line-height:.95;letter-spacing:-.02em}
.lime{width:28px;height:28px;border-radius:50% 8% 50% 8%;background:linear-gradient(135deg,#a6e22e,#5bbf1c);display:inline-block;transform:rotate(-20deg)}
.trk{display:flex;align-items:center}
.trk .d{width:8px;height:8px;border-radius:50%;background:#888;display:grid;place-items:center;color:#fff;font-size:7px;font-style:normal}
.trk .d.g{background:var(--deep)}
.trk .d.chk{background:var(--green)}
.trk .l{flex:1;height:3px;background:#888;margin:0 4px;border-radius:2px}
.trk .l.g{background:var(--green)}
.lbls{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--muted)}
.lbls .g{color:var(--deep);font-weight:700}
.cart{justify-self:end;position:relative;margin-right:8px}
.cart i{position:absolute;top:-4px;right:-6px;width:12px;height:12px;border-radius:50%;background:#c00}
.cart.hidden{visibility:hidden}
/* shared */
h1,h2,h3{letter-spacing:-.03em;margin:0;font-weight:800}
h1{font-size:28px;line-height:1.2}
h2{font-size:22px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;margin-top:24px}
.l{font-size:15px;margin:12px 0 0}
.b{font-weight:700}
.r{color:var(--red);font-weight:700}
.ph{background:var(--ph);padding:0 3px;border-radius:3px;border:1px dashed #c9b100;font-weight:600;white-space:nowrap}
.btn{display:block;width:100%;background:#242424;color:#fff;border:0;border-radius:6px;height:48px;font-size:16px;font-weight:700;cursor:pointer}
.btn.off{background:#aaa;cursor:not-allowed}
.btn.ghost{background:#fff;color:#242424;border:1px solid #242424}
.navrow{display:flex;gap:12px;max-width:420px;margin:28px 0 0}
.navrow .btn{flex:1}
input.in,.sel,.fl>div{width:100%;border:1px solid #888;border-radius:6px;background:#fff0;height:48px;padding:0 14px;font-size:16px;font-family:inherit;display:flex;align-items:center;justify-content:space-between}
input.in::placeholder{color:#777}
/* highlight */
.chg{position:relative}
.hl .chg{outline:2px dashed var(--pink);outline-offset:3px;border-radius:6px}
.hl .chg::after{content:attr(data-tag);position:absolute;top:-10px;right:6px;background:var(--pink);color:#fff;font:700 9px/1 Arial;padding:2px 5px;border-radius:3px;letter-spacing:.06em;z-index:5}
/* sidebar */
.side .l{margin-top:10px}
.offer{background:var(--mint);margin:14px -16px;padding:12px 16px;display:flex;gap:10px;font-size:14px;line-height:1.45}
.offer b{font-size:15px}
.pct{flex:none;width:18px;height:18px;border-radius:50%;background:#242424;color:#fff;display:grid;place-items:center;font-size:10px;margin-top:2px}
.hfbox{margin:12px 0 4px;border:1.5px solid var(--green);background:#e9f7ec;border-radius:8px;padding:12px 14px}
.hfbox.off{border-color:#bbb;background:#f3f1ec}
.hfh{display:flex;align-items:center;gap:8px;font-size:15px}
.hfb{background:var(--deep);color:#fff;font-weight:800;font-size:11px;padding:3px 6px;border-radius:4px}
.hfp{margin-left:auto;font-size:14px}
.hfp em{font-style:normal;color:var(--green);font-weight:800}
.hfbox p{margin:6px 0 0;font-size:13px;line-height:1.4}
.row{display:flex;justify-content:space-between;font-size:16px;padding:8px 0}
.row.tot{font-weight:700}
.tag{font-style:normal;background:var(--deep);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
.promo{display:flex;justify-content:space-between;align-items:center;margin-top:28px;cursor:pointer}
.promo h2{font-size:22px}
.promo span{display:flex;gap:14px;align-items:center}
.okc{width:22px;height:22px;border-radius:50%;background:#0a7d3c;color:#fff;font-style:normal;display:grid;place-items:center;font-size:12px}
.chev{width:9px;height:9px;border-right:2px solid #222;border-bottom:2px solid #222;transform:rotate(45deg);display:block;margin-bottom:3px}
.chev.up{transform:rotate(-135deg);margin-bottom:-3px}
.promobody{margin-top:14px}
.codebox{display:grid;grid-template-columns:1fr 100px;gap:10px}
.codebox>div{border:1px solid var(--green);border-radius:6px;height:48px;padding:0 12px;display:flex;align-items:center;gap:10px;font-size:15px;position:relative}
.codebox>div small{position:absolute;top:-8px;left:10px;background:var(--bg);padding:0 4px;font-size:12px;color:var(--green)}
.codebox button{border:1.5px solid #222;background:transparent;border-radius:6px;font-size:15px;font-weight:700}
.tagic{width:11px;height:11px;background:#222;transform:rotate(45deg);border-radius:2px}
.promobody ul{margin:14px 0 0;padding-left:18px;font-size:14px;line-height:1.45}
.promobody li{margin-bottom:4px}
.dh{font-size:22px;margin-top:40px}
.fl{position:relative;margin-top:18px}
.fl label{position:absolute;top:-8px;left:10px;background:var(--bg);padding:0 4px;font-size:12px;color:var(--green);z-index:1}
.fl>div{border-color:var(--green);font-size:15px}
.sel{margin-top:24px;color:#666;border-color:#aaa}
.caret{border:6px solid transparent;border-top-color:#222;margin-top:5px}
.side p.n{font-size:14px;line-height:1.5;margin:18px 0 0}
/* plan */
.seg{display:flex;border:1px solid #444;border-radius:8px;overflow:hidden;margin:10px 0 22px}
.seg button{flex:1;height:44px;border:0;border-right:1px solid #444;background:#fff;font-size:16px;cursor:pointer}
.seg button:last-child{border:0}
.seg button.on{background:#242424;color:#fff;font-weight:700}
.sumcard{background:var(--panel);border-radius:12px;padding:20px 18px}
.sumcard .offer{margin:14px 0;border-radius:4px;padding:12px 10px;font-size:14px}
.sumcard .row{border-top:1px solid var(--line)}
.sumcard h2{font-size:24px}
.sumcard h4{margin:18px 0 6px;font-size:15px}
.sumcard p{margin:4px 0;font-size:15px}
.mbg{display:flex;align-items:center;gap:10px;margin:22px 0 0;padding:12px 14px;background:#e8f6ec;border-radius:8px;font-size:14px;max-width:420px}
.mbg b{display:block}
.mbg .ico,.trust .ico{flex:none;width:36px;height:36px;border-radius:8px;background:#d9f0e0;display:grid;place-items:center}
.mbg .ico:before{content:"";width:14px;height:10px;border:2px solid var(--deep);border-radius:2px;box-shadow:2px -2px 0 var(--deep)}
.trust .ico.cal:before{content:"";width:14px;height:12px;border:2px solid var(--deep);border-radius:2px}
.trust .ico.box:before{content:"";width:12px;height:12px;border:2px solid var(--deep);border-radius:2px}
/* account */
.acct{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;max-width:1100px;margin:36px auto 0}
.card{display:grid;grid-template-columns:180px 1fr;border-radius:10px;overflow:hidden;margin-bottom:20px;box-shadow:0 2px 6px #0002}
.card.mint{background:var(--mint)}
.card.aqua{background:var(--aqua)}
.card.factor{background:#fff;border:1px solid #ddd;display:block;padding:16px 18px}
.photo{background:linear-gradient(160deg,#d4885a,#2a6a58 60%,#c2e68a);min-height:220px;display:grid;place-items:end start;padding:8px;color:#fff9;font-size:11px}
.card .txt{padding:20px 18px}
.card h3{font-size:22px;margin-bottom:14px}
.ck{display:flex;gap:10px;font-size:14px;line-height:1.45;margin-bottom:12px}
.ck b{flex:none;width:18px;height:18px;border-radius:50%;background:#242424;color:#fff;display:grid;place-items:center;font-size:11px;margin-top:2px}
.big{font-size:36px;font-weight:800;letter-spacing:-.03em}
.party{background:radial-gradient(circle at 40% 55%,#f5b942 0 28%,#0000 30%),#c6f2e4}
.factor h4{margin:0 0 10px;font-size:14px;font-weight:700}
.factor .fk{display:flex;gap:10px;font-size:13px;line-height:1.4;margin-bottom:8px}
.factor .fk i{flex:none;width:20px;height:20px;border-radius:50%;background:#242424;color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px}
.right .sso{display:flex;justify-content:center;gap:40px;margin:28px 0 18px}
.sso button{width:48px;height:48px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:800;font-size:18px;cursor:pointer}
.or{display:flex;align-items:center;gap:12px;color:#333;font-size:14px;margin-bottom:18px}
.or:before,.or:after{content:"";flex:1;height:1px;background:#ddd}
.fine{font-size:13px;line-height:1.45;margin-top:14px}
.foot{text-align:center;font-size:13px;margin-top:40px;color:#555}
/* forms */
.fmrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;margin:20px 0}
.chk i{width:28px;height:28px;border-radius:5px;border:2px solid #333;display:grid;place-items:center;font-style:normal;color:#fff;font-size:16px;flex:none}
.chk i.on{background:#242424}
.legal{font-size:13px;line-height:1.45;margin:14px 0 18px}
.legal a{font-weight:700;text-decoration:underline}
/* payment */
.note{background:var(--lime);padding:14px 16px;font-size:15px;margin:18px 0 16px;max-width:100%;border-radius:4px}
.paybox{border:1px solid #ccc;border-radius:10px;background:var(--panel);overflow:hidden}
.pm{display:flex;align-items:center;gap:12px;padding:18px 20px;font-size:16px;cursor:pointer}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #444;display:grid;place-items:center;background:#fff}
.radio.on:after{content:"";width:12px;height:12px;border-radius:50%;background:#242424}
.brands{margin-left:auto;display:flex;gap:12px;font-weight:800;color:#1a3b8f;font-size:14px;align-items:center}
.cardf{background:var(--bg);border-top:1px solid #ccc;border-bottom:1px solid #ccc;padding:18px 20px}
.cardf label{font-size:14px;display:block;margin-bottom:4px}
.cardf .fm2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.cardf input{background:#fff;border-radius:6px}
.flex{background:var(--panel);border-radius:24px;padding:14px 16px;font-size:14px;line-height:1.35;margin:16px 0 18px}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 18px}
.trust .t{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.35}
.agree-pay{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;margin:0 0 14px;color:#444}
.agree-pay .chkb{margin-top:1px}
.trialbox{margin:16px 0 0;border:1.5px solid var(--green);background:#e9f7ec;border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.45}
.trialbox.off{border-color:#bbb;background:#f3f1ec}
.trialbox b.h{font-size:15px;display:flex;gap:8px;align-items:center}
.trialbox p{margin:6px 0 0}
.trialbox .due{display:flex;gap:18px;margin-top:10px;padding-top:10px;border-top:1px solid #9fcfae;font-size:13px;flex-wrap:wrap}
.trialbox.off .due{border-top-color:#ccc}
.togrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.tog{display:inline-flex;border:1px solid #444;border-radius:6px;overflow:hidden}
.tog button{border:0;background:#fff;padding:8px 12px;font-size:13px;cursor:pointer}
.tog button.on{background:#242424;color:#fff;font-weight:700}
.enr{max-width:520px;margin:24px auto 0}
.enr .sub{font-size:15px;color:#444;margin:8px 0 0}
.bens{border:1px solid #ddd;border-radius:10px;background:#fff;padding:6px 16px;margin:18px 0}
.bens-t{font-weight:800;font-size:16px;padding:8px 0 2px}
.ben{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:15px;line-height:1.35}
.ben+.ben{border-top:1px solid #eee}
.ben span{color:#555;font-size:13px}
.plan-h{letter-spacing:.08em;font-weight:700;color:#555;font-size:12px;margin:18px 0 4px}
.plan{border:1.5px solid #ccc;border-radius:10px;padding:14px 16px;margin:12px 0;cursor:pointer;position:relative;background:#fff;font-size:14px;line-height:1.4}
.plan.on{border-color:#242424}
.plan small{letter-spacing:.08em;font-weight:700;color:#555;font-size:11px}
.plan .amt{font-size:26px;font-weight:800;letter-spacing:-.03em}
.plan .amt span{font-size:15px;font-weight:400;letter-spacing:0}
.plan .sv{color:var(--green);font-weight:800}
.plan .radio{position:absolute;right:16px;top:18px}
.badge{position:absolute;top:-11px;left:50%;margin-left:-95px;width:190px;text-align:center;background:var(--green);color:#fff;font-size:11px;font-weight:800;padding:4px 0;border-radius:10px}
.cardl{font-size:13px;color:#444;margin:14px 0 10px}
.agree{display:flex;gap:10px;font-size:13px;line-height:1.45;color:#444;margin-bottom:14px;cursor:pointer}
.agree span{flex:1}.agree a{text-decoration:underline;font-weight:700}
.chkb{flex:none;width:22px;height:22px;border:2px solid #666;border-radius:5px;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;background:#fff}
.chkb.on{background:#242424;border-color:#242424}
.skip{text-align:center;margin:14px 0 0;text-decoration:underline;font-size:14px;color:#444;cursor:pointer}
/* BA-style sheet */
.entry{margin:16px 0 0;border:1.5px solid var(--green);background:#fff8e8;border-radius:8px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.entry .copy{flex:1;min-width:200px;font-size:14px;line-height:1.4}
.entry .copy b{display:block;font-size:15px;margin-bottom:2px}
.entry .btn{width:auto;padding:0 16px;height:40px;font-size:14px}
.entry .lnk{margin-left:8px;font-size:13px;color:var(--green);font-weight:700;text-decoration:underline;cursor:pointer}
.saved{margin:16px 0 0;background:#e8f6ec;border:1.5px solid var(--green);border-radius:8px;padding:14px 16px;font-size:14px}
.saved .saved-top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.saved .copy{flex:1;min-width:200px;line-height:1.4}
.saved .copy b{display:block;font-size:15px;margin-bottom:4px}
.saved .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.saved .btn{width:auto;padding:0 14px;height:36px;font-size:13px}
.saved .btn.ghost{background:#fff;color:#242424;border:1.5px solid #242424}
.saved .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.saved .meta{font-size:12px;color:#555;margin-top:8px}
.saved .meta .lnk{color:var(--green);font-weight:700;text-decoration:underline;cursor:pointer}
.saved .recpill{display:inline-block;background:var(--deep);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:4px;margin-bottom:8px;text-transform:uppercase}
.saved .plans-inline{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.saved .plans-inline .picks{padding:10px}
.saved .plans-inline .amt{font-size:15px}
.saved .plus-consent{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px solid #9fcfae;font-size:13px;line-height:1.4;color:#333;cursor:pointer}
.saved .plus-consent .chkb{flex-shrink:0;margin-top:1px}
.overlay{position:fixed;inset:0;background:#0007;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:24px}
.sheet{background:#fff;width:min(520px,100%);border-radius:16px 16px 12px 12px;padding:22px 22px 18px;max-height:min(92vh,760px);overflow:auto;box-shadow:0 8px 40px #0004}
.sheet .x{float:right;border:0;background:transparent;font-size:22px;cursor:pointer;line-height:1;color:#444}
.sheet .mark{width:56px;height:56px;border-radius:50%;background:#f5d76e;margin:8px auto 14px;display:grid;place-items:center}
.sheet .mark span{background:var(--deep);color:#fff;font-weight:800;font-size:12px;padding:4px 6px;border-radius:4px}
.sheet h1{text-align:center;font-size:24px;margin:0 0 6px}
.sheet .sub{text-align:center;font-size:14px;color:#444;margin:0 0 18px}
.plans2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.picks{border:1.5px solid #ccc;border-radius:10px;padding:14px 12px;cursor:pointer;position:relative;background:#fff;text-align:left}
.picks.on{border-color:#242424;box-shadow:inset 0 0 0 1px #242424}
.picks .badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);margin:0;width:auto;padding:3px 10px;white-space:nowrap}
.picks small{display:block;font-size:11px;letter-spacing:.06em;font-weight:700;color:#555;margin-bottom:6px}
.picks .amt{font-size:18px;font-weight:800;line-height:1.25}
.picks .after{font-size:12px;color:#555;margin-top:4px}
.sheet .payline{border:1px solid #ddd;border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sheet .fineprint{font-size:11px;line-height:1.4;color:#555;margin:0 0 12px}
.sheet .agree{margin-bottom:12px}
.success{background:#fff8e8;border-radius:16px;padding:28px 22px 18px;text-align:center}
.success .mark{margin:0 auto 14px}
.success .eyebrow{font-size:11px;letter-spacing:.08em;font-weight:700;color:#555;margin-bottom:6px}
.success h1{font-size:26px;margin:0 0 8px}
.success p{font-size:15px;margin:0 0 18px}
.tb .grp.flow{opacity:1}
.tb .grp.flow.dim{opacity:.45;pointer-events:none}
/* notes */
.notes{margin-top:14px;background:#fff;border-radius:10px;padding:16px 20px;font-size:13px;line-height:1.45;box-shadow:0 1px 6px #0001}
.notes h5{margin:0 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--pink)}
.notes ul{margin:0;padding-left:16px}
.notes li{margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#242424;color:#fff;padding:12px 18px;border-radius:8px;z-index:50;font-size:14px}
@media(max-width:960px){.grid2,.acct,.trust{grid-template-columns:1fr;gap:22px}.frame{padding:0 16px 32px}.card{grid-template-columns:1fr}.photo{min-height:100px}}
</style></head>
<body>
<div class="tb" id="tb">
  <div class="grp"><span>Variant</span><button data-v="cur">Control (free shipping)</button><button data-v="entry">V1: no FS (Plus post-signup)</button><button data-v="trial">V2: HF+ 1-month trial</button></div>
  <div class="grp flow" id="flowgrp"><span>V2 flow</span><button data-flow="current">Toggle → plan page</button><button data-flow="sheet">Opt-in sheet</button><button data-flow="recommend">Recommended + consent</button></div>
  <div class="grp"><span>Screen</span><button data-s="plan">1 Plan</button><button data-s="acct">2 Create account</button><button data-s="addr">3 Address</button><button data-s="pay">4 Payment</button><button data-s="enroll" id="enrollbtn">5 Choose HF+ plan</button></div>
  <div class="grp"><label><input type="checkbox" id="hl" checked> Highlight changes</label><label><input type="checkbox" id="nt" checked> Notes</label></div>
</div>
<div class="wrap"><div class="frame" id="frame"></div><div id="notes"></div></div>
<script>
const S={v:'trial',scr:'plan',hl:true,notes:true,pay:'card',trialOptIn:true,plan:'m',agree:false,payAgree:false,plusConsent:false,flow:'current',sheetOpen:false,sheetSuccess:false,promo:{plan:false,addr:false,pay:true},card:{n:'',e:'',c:''}};
const T=()=>S.v==='trial';
const E=()=>S.v==='entry';
const sheetBa=()=>T()&&S.flow==='sheet';
const recommend=()=>T()&&S.flow==='recommend';
const sheetFlow=()=>sheetBa();
const noEnrollPage=()=>sheetBa()||recommend();
const defaultTrialOn=()=>S.flow==='current'||S.flow==='recommend';
const shipFree=()=>S.v==='cur'||(T()&&S.trialOptIn);
/* Brief SoT: V2 opt-in = 5-5-5-5; Control / V1 / V2 decline = BAU 15-15-15-15 */
const tailPct=()=>T()&&S.trialOptIn?5:15;
const tailLabel=()=>`${tailPct()}% off`;
const C=tag=>S.v!=='cur'?`chg" data-tag="${tag}`:'';
const ph=t=>`<span class="ph">${t}</span>`;
const $=s=>document.querySelector(s);
const checkoutStep=()=>S.scr==='addr'||S.scr==='pay'||S.scr==='enroll';

const header=()=>{
  const chk=checkoutStep();
  const d1=chk?'chk':'g';
  const d2=chk?'g':'';
  const l1='g';
  const l2=chk?'':'';
  const lab1='g';
  const lab2=chk?'g':'';
  const cartCls=chk?'':' hidden';
  return `<header class="hd"><div class="logo"><i class="lime"></i><span>HELLO<br>FRESH</span></div>
<div class="steps"><div class="trk"><i class="d ${d1}">${chk?'✓':''}</i><b class="l ${l1}"></b><i class="d ${d2}"></i><b class="l ${l2}"></b><i class="d"></i></div>
<div class="lbls"><span class="${lab1}">Your profile</span><span class="${lab2}">Checkout</span><span>Pick Meals</span></div></div>
<div class="cart${cartCls}"><svg width="28" height="24" viewBox="0 0 34 30" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h5l4 16h15l4-11H9"/><circle cx="13" cy="25" r="2"/><circle cx="25" cy="25" r="2"/></svg><i></i></div></header>`;
};

/* Live checkout summaries do not show a tax line; keep one price system across screens. */
const P=()=>{
  const base={list:'$53.96',sale:'$25.78',tot0:'$66.95',totFree:'$25.78',sv0:'$13.49',sv:'$6.45',off:'$28.18',ship:'$12.99'};
  const free=shipFree();
  return {...base,tot:free?base.totFree:'$38.77',shipFree:free};
};

const offerBox=()=>`<div class="offer"><span class="pct">%</span><div><b>Special Offer Applied</b> Free Breakfast Item For Life, one per box with active subscription</div></div>`;
const hfTrial=()=>{
  if(!T())return '';
  if(S.trialOptIn){
    const tip=recommend()?' Recommended — confirm with explicit consent at payment.':(sheetBa()?'':' Confirm your free trial at payment before you place your order.');
    return `<div class="hfbox ${C('NEW')}"><div class="hfh"><span class="hfb">HF+</span><b>HelloFresh Plus</b><span class="hfp"><em>1 month free</em></span></div><p>Free shipping on every box + exclusive member benefits.${tip}</p></div>`;
  }
  if(sheetBa())return `<div class="hfbox off ${C('NEW')}"><div class="hfh"><span class="hfb">HF+</span><b>Unlock free shipping with HF+</b></div><p>1-month free trial · free shipping + exclusive member benefits. Start the trial at payment.</p></div>`;
  return `<div class="hfbox off ${C('CHANGED')}"><div class="hfh"><span class="hfb">HF+</span><b>HelloFresh Plus trial declined</b></div><p>Shipping is charged on this order. You can still join paid HelloFresh Plus after signup.</p></div>`;
};
const hfBox=()=>T()?hfTrial():'';
/* Live Plan uses $0; Address/Payment use Free */
const shipRow=(mode='checkout')=>{
  const free=shipFree();
  const tag=T()&&S.trialOptIn?'<i class="tag">HF+ benefit</i>':'';
  const freeLabel=mode==='plan'?`$0`:`Free`;
  const price=free?`<s>$12.99</s> <b class="r">${freeLabel}</b>`:`<b>$12.99</b>`;
  return `<div class="row ${(T()||E())?C('CHANGED'):''}"><span>Shipping${tag}</span><span>${price}</span></div>`;
};
const totalCell=p=>`<s>${p.tot0}</s> <b class="r">${p.tot}</b>`;
const rows=(p,mode='checkout')=>`<div class="row"><span>Box price</span><span><s>${p.list}</s> <b class="r">${p.sale}</b></span></div>
${shipRow(mode)}
<div class="row tot"><span>First box total</span><span>${totalCell(p)}</span></div>`;

const promo=(key,p)=>{const open=S.promo[key];
  const firstBoxExtra=T()&&S.trialOptIn?' + <b>1 month of HelloFresh Plus free</b>':(S.v==='cur'?' + free shipping':'');
  return `<div class="promo" data-toggle="${key}"><h2>Promo code</h2><span><i class="okc">&#10003;</i><i class="chev ${open?'up':''}"></i></span></div>
${open?`<div class="promobody"><div class="codebox"><div><small>Promo code</small><i class="tagic"></i>EL-6B7QY38KC<span style="margin-left:auto;color:var(--green)">&#10003;</span></div><button>Apply</button></div>
<ul><li class="${(T()||E())?C('CHANGED'):''}"><b class="r">${p.off} off</b>${firstBoxExtra} on your first box</li>
<li class="${T()&&S.trialOptIn?C('CHANGED'):''}"><b class="r">${tailLabel()}</b> across your next 4 boxes</li>
<li>Special Offer Applied Free Breakfast Item For Life, one per box with active subscription</li></ul></div>`:''}`};

const deliv=()=>`<h2 class="dh">Delivery address</h2><div class="fl"><label>First delivery</label><div>Saturday, November 14<span>&#9638;</span></div></div><div class="sel">Delivery instructions <i class="caret"></i></div>
<p class="n">Your first delivery will be reserved for this date.</p><p class="n" style="margin-top:14px">We'll set future deliveries for every <b>Saturday</b>, which you can change anytime.</p>`;

const sidebar=(key,deliveryOn)=>{const p=P();return `<aside class="side"><h2>Order Summary</h2><p class="l">2 meals for 2 people</p><p class="l">4 total servings at <s>${p.sv0}</s> <b class="r">${p.sv}</b> per serving</p>${offerBox()}${hfBox()}${rows(p,'checkout')}${promo(key,p)}${deliveryOn?deliv():''}</aside>`};

const benefitLines=()=>{
  const first=S.v==='cur'
    ?'50% off and free shipping on your first box'
    :'50% off your first box';
  const lines=[
    `<div class="ck ${(E()||T())?C('CHANGED'):''}"><b>&#10003;</b><span>${first}</span></div>`,
    `<div class="ck ${T()&&S.trialOptIn?C('CHANGED'):''}"><b>&#10003;</b><span>${tailLabel()} your next 4 boxes</span></div>`,
    `<div class="ck"><b>&#10003;</b><span>Free Breakfast Item For Life, one per box with active subscription</span></div>`
  ];
  if(T()) lines.push(`<div class="ck ${C('NEW')}"><b>&#10003;</b><span>Free shipping + exclusive member benefits with 1 month free trial of HF+</span></div>`);
  return lines.join('');
};

const trialBlock=(p,on,sheet)=>{
  if(!T())return '';
  if(recommend()){
    if(on){
      const m=S.plan==='m';
      const terms=m?'$24.99 + tax every 28 days':'$99.00 + tax every 365 days';
      return '<div class="saved '+C('NEW')+'"><span class="recpill">Recommended</span><div class="saved-top"><div class="copy"><b>HF+ free trial · Free shipping</b>You\'re seeing free shipping as the recommended path (<b class="r">$12.99 saved</b>). Free shipping + exclusive member benefits — not a weekly discount. Enrollment needs your explicit consent below.</div></div><div class="plans-inline"><div class="picks '+(m?'on':'')+'" data-plan="m"><small>MONTHLY</small><div class="amt">28-day free trial</div><div class="after">then $24.99/mo</div></div><div class="picks '+(m?'':'on')+'" data-plan="a"><span class="badge">BEST VALUE</span><small>ANNUAL</small><div class="amt">28-day free trial</div><div class="after">then $99/yr · $8.25/mo</div></div></div><div class="plus-consent" data-plus-consent><i class="chkb '+(S.plusConsent?'on':'')+'">'+(S.plusConsent?'✓':'')+'</i><span>I want the 1-month HelloFresh Plus free trial. Unless I cancel before '+ph('[trial end date]')+', I will be charged '+terms+' (auto-renewing). HF+ and my meal plan require separate cancellation. I agree to the HF+ <a>Terms</a> and <a>Privacy Policy</a>.</span></div><div class="actions"><button class="btn danger" type="button" data-trial="0">Continue without · pay shipping</button></div></div>';
    }
    return '<div class="entry '+C('NEW')+'"><div class="copy"><b>Paying shipping on this order</b>Shipping is <b>$12.99</b>. You can still add the recommended HF+ free trial.</div><button class="btn" type="button" data-trial="1">Add free trial · Free shipping</button></div>';
  }
  if(sheet){
    if(on)return '<div class="saved '+C('NEW')+'"><div class="saved-top"><div class="copy"><b>HF+ free trial on</b>You\'re saving <b class="r">$12.99</b> shipping on this order. Free shipping + exclusive member benefits.</div></div><div class="actions"><button class="btn ghost" type="button" data-sheet-open>Manage plan</button><button class="btn danger" type="button" data-trial="0">Remove</button></div></div>';
    return '<div class="entry '+C('NEW')+'"><div class="copy"><b>Get free shipping. Try HelloFresh Plus for free.</b>1-month free trial · free shipping + exclusive member benefits. Not a weekly discount.</div><button class="btn" type="button" data-sheet-open>Start free trial</button><span class="lnk" data-trial="0">No thanks</span></div>';
  }
  const body=on
    ?('Include the 1-month HF+ trial for <b>free shipping</b> on this order + exclusive member benefits (not a weekly discount). You\'ll choose how you pay after the free month on the next step.')
    :'Decline the trial and shipping is <b>$12.99</b> on this order. You can still join paid HelloFresh Plus after signup.';
  return '<div class="trialbox '+(on?'':'off ')+C('NEW')+'"><b class="h"><span class="hfb">HF+</span>'+(on?'Include HF+ free trial':'HF+ free trial')+'</b><p>'+body+'</p><div class="togrow"><div class="tog" data-trial-tog><button type="button" class="'+(on?'on':'')+'" data-trial="1">Include trial · Free shipping</button><button type="button" class="'+(on?'':'on')+'" data-trial="0">Decline · Pay shipping</button></div></div><div class="due"><span>Due today: <b>'+p.tot+'</b> ('+(on?'box':'box + shipping')+')</span><span>HF+ today: <b>$0.00</b></span></div></div>';
};

const screens={
plan:()=>{const p=P();return `${header()}<main class="grid2"><section><h1>Here's a recommended plan that fits your routine. Adjust anytime.</h1>
<div style="height:36px"></div><b>Servings per dinner</b><div class="seg" data-seg>${[2,3,4,6].map((n,i)=>`<button class="${i?'':'on'}">${n}</button>`).join('')}</div>
<b>Dinners per week</b><div class="seg" data-seg>${[2,3,4,5,6].map((n,i)=>`<button class="${i?'':'on'}">${n}</button>`).join('')}</div>
<div class="mbg"><span class="ico"></span><div><b>Love it or your first order is on us.</b>100% money back guarantee.</div></div>
<div class="navrow"><button class="btn ghost" type="button">Back</button><button class="btn" data-go="acct">Next</button></div></section>
<aside class="sumcard"><h2>Your Summary</h2><h4>Preferences</h4><p>Meat &amp; Veggies</p><h4 style="margin-top:22px">Order summary</h4>
<p>2 meals for 2 people per week</p><p>4 servings at <s>${p.sv0}</s> <b class="r">${p.sv}</b> per serving</p>
<div class="offer"><div style="flex:1"><b style="font-weight:400">Special Offer Applied</b><br><span style="font-size:13px">Free Breakfast Item For Life, one per box with active subscription</span></div><b>FREE</b></div>
${hfBox()}${rows(p,'plan')}</aside></main>`},
acct:()=>`${header()}<main class="acct"><div><div class="card mint"><div class="photo">photo</div><div class="txt"><h3>What's waiting for you</h3>
${benefitLines()}</div></div>
<div class="card aqua"><div class="photo party"></div><div class="txt"><h3 style="margin-bottom:4px">Join the</h3><div class="big">25,656</div><p style="font-size:14px;margin:8px 0 0">customers who became part of the HelloFresh community today.*</p></div></div>
<div class="card factor"><h4>Brought to you by</h4>
<div class="fk"><i>1</i><span><b>One single login.</b> Access both HelloFresh and Factor with one email and password.</span></div>
<div class="fk"><i>2</i><span><b>Simplified checkout.</b> Use your HelloFresh password to checkout faster.</span></div></div></div>
<div class="right"><h2 style="text-align:center">Create account</h2><div class="sso"><button>Apple</button><button style="color:#4285f4">G</button></div><div class="or">or</div>
<input class="in" placeholder="Email" style="margin-bottom:14px"><button class="btn" data-go="addr">Continue</button>
<p class="fine">By submitting, you agree to receive marketing emails and our <b><u>Terms</u></b> and <b><u>Privacy Policy</u></b>. Unsubscribe at any time.</p></div></main>
<p class="foot">*New member count based on the average daily number of customers who signed up for HelloFresh globally.</p>`,
addr:()=>`${header()}<main class="grid2"><section><h1>Add your delivery address</h1><div style="height:16px"></div>
<div class="fmrow"><input class="in" placeholder="First name *"><input class="in" placeholder="Last name *"></div>
<input class="in" placeholder="Phone number *" style="margin-bottom:12px"><input class="in" placeholder="Street *" style="margin-bottom:12px">
<u style="font-size:14px;margin-left:12px;display:inline-block">Enter address manually</u>
<div class="chk"><i class="on">&#10003;</i>Billing is the same as delivery</div><hr style="border:0;border-top:1px solid var(--line);margin:0 0 16px">
<div class="chk" style="margin-top:0"><i></i>Receive offers and promotions via text message</div>
<p class="legal">By checking the box above, I agree to HelloFresh's <a>Terms and Conditions</a> &amp; <a>Privacy Policy</a> and agree to receive recurring texts via automated technology, including for promotions, subscriptions, cart reminders, etc., by or on behalf of HelloFresh, including after any subscription deactivation. I understand that consent is not a condition of any purchase, that message &amp; data rates may apply, and that I may opt out at any time by texting STOP or text HELP for assistance.</p>
<button class="btn" data-go="pay">Next</button></section>${sidebar('addr',true)}</main>`,
pay:()=>{
 const p=P();const card=S.pay==='card';const on=S.trialOptIn;const sheet=sheetBa();
 const placeGo=T()&&on&&S.flow==='current'?'enroll':'done';
 const plusLegal=T()&&on&&S.flow==='current'?(' I also agree to a 1-month free trial of HelloFresh Plus; unless I cancel before '+ph('[trial end date]')+', it renews at '+ph('$X/month')+' until I cancel.'):'';
 const cardFields=card?('<div class="cardf"><b style="font-size:15px">Prepaid or gift cards are not accepted.</b><label style="margin-top:10px">Card number</label><input class="in" id="cn" placeholder="1111 1111 1111 1111" value="'+S.card.n+'"><div class="fm2"><div><label>Expiration date</label><input class="in" id="ce" placeholder="MM / YY" value="'+S.card.e+'"></div><div><label>CVV</label><input class="in" id="cc" placeholder="111" value="'+S.card.c+'"></div></div></div>'):'';
 const sheetUI=sheet?(S.sheetSuccess?sheetSuccess():(S.sheetOpen?trialSheet():'')):'';
 return header()+'<main class="grid2"><section><h1>How would you like to pay?</h1><div class="note">You won\'t be charged yet. Your payment details are needed to reserve your delivery.</div><div class="paybox"><div class="pm" data-pm="card"><span class="radio '+(card?'on':'')+'"></span>Credit Card<span class="brands"><span style="color:#e53">●●</span><i>VISA</i><span style="font-size:11px">DISCOVER</span><span style="background:#2a76c9;color:#fff;font-size:10px;padding:4px 3px;border-radius:3px">AMEX</span></span></div>'+cardFields+'<div class="pm" data-pm="pp"><span class="radio '+(card?'':'on')+'"></span>PayPal<span class="brands"><span style="background:#fff;padding:6px 10px;color:#003087;font-style:italic">P</span></span></div></div>'+trialBlock(p,on,sheet)+'<div class="flex">Your plan is flexible. For future deliveries, you can <b>change, skip, or cancel</b> anytime before the weekly deadline.</div><div class="trust"><div class="t"><span class="ico cal"></span><div><b>No commitment</b><br>Pause or cancel flexibly</div></div><div class="t"><span class="ico box"></span><div><b>100% money-back guarantee</b><br>Don\'t love your first box? Get a full refund.</div></div></div><div class="agree-pay '+(T()?C('CHANGED'):'')+'" data-pay-agree><i class="chkb '+(S.payAgree?'on':'')+'">'+(S.payAgree?'✓':'')+'</i><span>By clicking "Place order &amp; select meals", I agree to the weekly auto-renewal price of $66.95 after my discount period ends. I can cancel my plan anytime in my account at least 5 days prior to my next delivery. I also agree to the <a>Terms and Conditions</a> and the <a>Privacy Policy</a>.'+plusLegal+'</span></div><button class="btn off" id="place" data-go="'+placeGo+'">Place order &amp; select meals</button></section>'+sidebar('pay',true)+'</main>'+sheetUI;
}};

const trialSheet=()=>{
 const m=S.plan==='m';
 const terms=m?'$24.99 + tax every 28 days':'$99.00 + tax every 365 days';
 return `<div class="overlay" data-sheet-backdrop><div class="sheet ${C('NEW')}" data-sheet-panel>
<button class="x" type="button" data-sheet-close aria-label="Close">×</button>
<div class="mark"><span>HF+</span></div>
<h1>Start your free trial of HelloFresh Plus</h1>
<p class="sub">Free shipping + exclusive member benefits. Cancel anytime.</p>
<div class="plans2">
<div class="picks ${m?'on':''}" data-plan="m"><small>MONTHLY</small><div class="amt">28-day free trial</div><div class="after">then $24.99/mo after trial</div></div>
<div class="picks ${m?'':'on'}" data-plan="a"><span class="badge">BEST VALUE</span><small>ANNUAL</small><div class="amt">28-day free trial</div><div class="after">then $99/yr after trial · $8.25/mo</div></div>
</div>
<div class="payline"><span>Payment for HF+</span><b>Visa ···· 4242</b></div>
<p class="fineprint">Unless you cancel before ${ph('[trial end date]')}, HelloFresh Plus renews at ${terms} (auto-renewing). HF+ and your meal plan require separate cancellation. Exclusive member benefits are not a standing weekly discount.</p>
<div class="agree" data-agree><i class="chkb ${S.agree?'on':''}">${S.agree?'✓':''}</i><span>I accept the HelloFresh Plus <a>Terms and Conditions</a> and <a>Privacy Policy</a>.</span></div>
<button class="btn ${S.agree?'':'off'}" type="button" data-sheet-start>Start your 28-day free trial</button>
<p class="skip" data-trial="0">No thanks</p>
</div></div>`;
};
const sheetSuccess=()=>`<div class="overlay" data-sheet-backdrop><div class="sheet success ${C('NEW')}" data-sheet-panel>
<div class="mark"><span>HF+</span></div>
<div class="eyebrow">WELCOME</div>
<h1>You've unlocked membership savings</h1>
<p>You're saving <b>$12.99</b> on shipping for this order.</p>
<button class="btn" type="button" data-sheet-dismiss>Return to payment</button>
</div></div>`;

screens.enroll=()=>{
 if(!T())return `${header()}<main style="max-width:520px;margin:60px auto;text-align:center;font-size:16px;color:#555">HF+ plan selection only exists in V2 after free-trial opt-in. Switch to V2 above.</main>`;
 if(noEnrollPage())return `${header()}<main style="max-width:560px;margin:60px auto;text-align:center;font-size:16px;color:#555">${recommend()?'Recommended + consent finishes enrollment on Payment (explicit HF+ checkbox).':'Opt-in sheet has no post-order plan page — plan + terms happen in the Payment sheet.'} Switch V2 flow to Toggle → plan page to see screen 5.</main>`;
 if(!S.trialOptIn)return `${header()}<main style="max-width:560px;margin:60px auto;text-align:center;font-size:16px;color:#555">Customer declined the free trial on Payment. Shipping stayed charged. Paid HF+ can be offered post-signup in cart (out of scope this round).</main>`;
 const m=S.plan==='m';
 const terms=m?'$24.99 + tax every 28 days':'$99.00 + tax every 365 days';
 return `${header()}<main class="enr"><h1>Choose your HF+ plan</h1><p class="sub">You're in — pick how you'll pay after the free month.</p>
<div class="bens ${C('NEW')}"><div class="bens-t">HelloFresh Plus benefits</div>
<div class="ben"><div><b>Free shipping on every box</b><br><span>Save $12.99 per week on delivery fees</span></div><i class="okc">&#10003;</i></div>
<div class="ben"><div><b>Exclusive member benefits</b><br><span>Sporadic member offers — not a standing weekly discount</span></div><i class="okc">&#10003;</i></div></div>
<div class="plan-h">AFTER YOUR FREE MONTH</div>
<div class="plan ${m?'on':''} ${C('NEW')}" data-plan="m"><small>MONTHLY · DEFAULT</small><div class="amt">$24.99 <span>/ mo</span></div><div>billed every 28 days after trial</div><span class="radio ${m?'on':''}"></span></div>
<div class="plan ${m?'':'on'} ${C('NEW')}" data-plan="a"><span class="badge">BEST VALUE · SAVE 70%</span><small>ANNUAL</small><div class="amt">$99 <span>/ yr</span></div><div>billed every 365 days after trial</div><div class="sv">$8.25 / mo</div><span class="radio ${m?'':'on'}"></span></div>
<p class="cardl">Card ending in ···· 4242 (from checkout) · free month still $0 today</p>
<div class="agree" data-agree><i class="chkb ${S.agree?'on':''}">${S.agree?'✓':''}</i><span>By checking this box and clicking "Confirm plan", I confirm my HelloFresh Plus plan. Unless I cancel before ${ph('[trial end date]')}, I will be charged ${terms} (auto-renewing). HelloFresh Plus and my meal plan require separate cancellation. I also agree to the HelloFresh Plus <a>Terms and Conditions</a> and <a>Privacy Policy</a>.</span></div>
<button class="btn ${S.agree?'':'off'}" data-go="done2">Confirm plan</button><p class="skip" data-skip-shipping>Skip — pay shipping</p></main>`};

const NOTES={
plan:['HF+ block only in V2. Toggle → plan page and Recommended+consent: free shipping from Plan. Opt-in sheet: charged until Payment sheet. V2 opt-in tails = 5% (not BAU 15%).'],
acct:['V1/V2 remove free shipping from the first benefit line. V2 adds HF+ trial line. Opt-in shows 5% on next 4 boxes; decline keeps 15%.'],
addr:['Only V2 HF+ / shipping / tail % differs from Control. Opt-in = 5% tails in promo.'],
pay:['Toggle → plan page: Payment = include/decline trial (shipping only). Plan choice happens after Place order. Opt-in swaps to 5% tails.'],
enroll:['Split decision: you\'re already in. Choose post-trial plan (not Start free trial). Skip — pay shipping declines HF+ and charges shipping.']
};
const NOTES_SHEET={
plan:['Opt-in sheet: shipping charged until Payment sheet completes.'],
acct:['Trial unlocked at Payment sheet.'],
addr:['Shipping charged until sheet attach.'],
pay:['Entry banner → sheet (plan + terms) → start trial → $12.99 savings → return to Payment. No screen 5.'],
enroll:['Not used.']
};
const NOTES_RECOMMEND={
plan:['Recommended path: free shipping + HF+ shown from Plan. Not enrolled until Payment consent.'],
acct:['Trial framed as recommended benefit.'],
addr:['Free shipping while recommended path still selected.'],
pay:['Free shipping + plan picker shown as recommended. Unticked HF+ consent required to Place order with free shipping. Continue without · pay shipping is the clear opt-out. No screen 5.'],
enroll:['Not used — consent + plan happen on Payment.']
};
const NOTES_E={
plan:['V1: charged shipping ($12.99), no HF+ module.'],
acct:['No free shipping claim. Plus post-signup only.'],
addr:['Charged shipping in summary. No HF+ block.'],
pay:['No in-funnel Plus module. Shipping stays $12.99.'],
enroll:['No in-funnel HF+ plan screen for V1.']
};
const NOTES_C={
plan:['Control: free shipping on first box. No HF+ messaging.'],
acct:['Control keeps free shipping in the first benefit line.'],
addr:['BAU free shipping in order summary.'],
pay:['No trial module.'],
enroll:['No HF+ enrollment in Control.']
};
function render(){
  $('#frame').innerHTML=screens[S.scr]();
  $('#frame').classList.toggle('hl',S.hl&&S.v!=='cur');
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.v));
  document.querySelectorAll('[data-flow]').forEach(b=>b.classList.toggle('on',b.dataset.flow===S.flow));
  document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===S.scr));
  $('#flowgrp').classList.toggle('dim',!T());
  $('#enrollbtn').style.opacity=noEnrollPage()?'.45':'';
  const noteList=recommend()?(NOTES_RECOMMEND[S.scr]||[]):sheetBa()?(NOTES_SHEET[S.scr]||[]):T()?(NOTES[S.scr]||[]):E()?(NOTES_E[S.scr]||[]):(NOTES_C[S.scr]||['Control: no HF+ changes.']);
  $('#notes').innerHTML=S.notes?`<div class="notes"><div><h5>What changes on this screen</h5><ul>${noteList.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`:'';
  upd();
}
function upd(){
  const b=$('#place');if(!b)return;
  const needPlus=recommend()&&S.trialOptIn&&!S.plusConsent;
  b.classList.toggle('off',!S.payAgree||needPlus);
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

document.addEventListener('click',e=>{
  const t=e.target;let el;
  if(el=t.closest('[data-sheet-start]')){
    if(el.classList.contains('off')){toast('Prototype: accept HF+ terms to start trial');return}
    S.trialOptIn=true;S.sheetOpen=false;S.sheetSuccess=true;S.agree=false;render();return;
  }
  if(el=t.closest('[data-sheet-open]')){S.sheetOpen=true;S.sheetSuccess=false;S.agree=false;render();return}
  if(el=t.closest('[data-sheet-dismiss]')){S.sheetSuccess=false;render();return}
  if(el=t.closest('[data-trial]')){
    S.trialOptIn=el.dataset.trial==='1';
    S.plusConsent=false;
    if(!S.trialOptIn){S.sheetOpen=false;S.sheetSuccess=false}
    render();return;
  }
  if(el=t.closest('[data-plus-consent]')){S.plusConsent=!S.plusConsent;render();return}
  if(el=t.closest('[data-sheet-close]')){S.sheetOpen=false;render();return}
  if(el=t.closest('[data-sheet-backdrop]')&&!t.closest('[data-sheet-panel]')){S.sheetOpen=false;S.sheetSuccess=false;render();return}
  if(el=t.closest('[data-plan]')){S.plan=el.dataset.plan;render();return}
  if(el=t.closest('[data-agree]')){S.agree=!S.agree;render();return}
  if(el=t.closest('[data-pay-agree]')){S.payAgree=!S.payAgree;render();return}
  if(el=t.closest('[data-flow]')){
    S.flow=el.dataset.flow;S.sheetOpen=false;S.sheetSuccess=false;S.agree=false;S.plusConsent=false;
    S.trialOptIn=defaultTrialOn();
    if(noEnrollPage()&&S.scr==='enroll')S.scr='pay';
    render();return;
  }
  if(el=t.closest('[data-v]')){
    S.v=el.dataset.v;S.sheetOpen=false;S.sheetSuccess=false;S.plusConsent=false;
    if(S.v==='trial')S.trialOptIn=defaultTrialOn();
    render();return;
  }
  if(el=t.closest('[data-s]')){S.scr=el.dataset.s;S.sheetOpen=false;S.sheetSuccess=false;render();window.scrollTo(0,0);return}
  if(el=t.closest('[data-toggle]')){S.promo[el.dataset.toggle]=!S.promo[el.dataset.toggle];render();return}
  if(el=t.closest('[data-pm]')){S.pay=el.dataset.pm;render();return}
  if(el=t.closest('[data-seg] button')){el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));el.classList.add('on');return}
  if(el=t.closest('[data-skip-shipping]')){
    S.trialOptIn=false;S.plusConsent=false;S.agree=false;
    toast('Skipped HF+ · pay shipping · next step is Pick Meals');
    return;
  }
  if(el=t.closest('[data-go]')){
    if(el.classList.contains('off')){
      const needPlus=recommend()&&S.trialOptIn&&!S.plusConsent;
      const needPlanAgree=S.scr==='enroll'&&!S.agree;
      toast(needPlus?'Prototype: check HF+ consent to keep free shipping, or continue without':needPlanAgree?'Prototype: accept HF+ plan terms to confirm':'Prototype: accept meal-plan terms to Place order');
      return;
    }
    if(el.dataset.go==='done'||el.dataset.go==='done2'){toast('End of prototype: next step is Pick Meals');return}
    S.scr=el.dataset.go;render();window.scrollTo(0,0);
  }
});
document.addEventListener('input',e=>{const m={cn:'n',ce:'e',cc:'c'}[e.target.id];if(m){S.card[m]=e.target.value;upd()}});
$('#hl').addEventListener('change',e=>{S.hl=e.target.checked;render()});
$('#nt').addEventListener('change',e=>{S.notes=e.target.checked;render()});
render();
</script>
</body></html>
